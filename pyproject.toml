[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vasctherm"
version = "1.0.0"
description = "Non-equilibrium thermodynamics of adaptively remodeling vascular networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Enrique Hernández-Lemus", email = "ehernandez@inmegen.gob.mx" },
  { name = "Daniel Pérez-Calixto" },
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
